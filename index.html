<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Creation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/resets.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/pallete.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <div class="heading">
        <h1>Welcome to Movie Group</h1>
        <h2>Please Create a New Account to Join our Community</h2>
      </div>
    </header>
    <main>
      <form action="#">
        <section class="card-wrapper">
          <div class="card">
            <div class="input-labels">
              <label for="username"
                >Username <span class="req-symbol">*</span></label
              >
              <input
                type="text"
                id="username"
                name="username"
                placeholder="ex. John Doe"
                autofocus
                required
              />
            </div>

            <div class="input-labels">
              <label for="password"
                >Password <span class="req-symbol">*</span></label
              >
              <input
                type="password"
                id="password"
                name="password"
                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                title="Password must contain at least one 0～9,a～z and A～Z, and at least 8 characters"
                required
                minlength="8"
                maxlength="20"
              />
            </div>

            <div class="input-labels">
              <label for="email">Emai <span class="req-symbol">*</span></label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="name@address.com"
                required
              />
            </div>

            <div class="input-labels">
              <label for="first-name">First Name <span class="req-symbol">*</span></label>
              <input
                type="text"
                id="first-name"
                name="first-name"
                placeholder="John"
                required
              />
            </div>

            <div class="input-labels">
              <label for="last-name">Last Name</label>
              <input
                type="text"
                id="last-name"
                name="last-name"
                placeholder="(Optional)"
              />
            </div>

            <div class="input-labels">
              <label for="phone">Phone Number</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Write it with your country code."
              />
            </div>

            <div class="input-labels">
              <label for="birthday"
                >Birthday</label
              >
              <input type="date" id="birthday" name="birthday" />
            </div>

            <div class="input-labels">
              <p>Gender:</p>
              <div class="radio">
                <label for="male">Male</label>
                <input type="radio" id="male" name="gender" value="male" />

                <label for="female">Female</label>
                <input type="radio" id="female" name="gender" value="female" />

                <label for="other">Other</label>
                <input type="radio" id="other" name="gender" value="other" />
              </div>
            </div>

            <div class="input-labels">
              <label for="color">Pick Profile Color:</label>
              <input type="color" id="color" name="color" />
            </div>

            <div class="input-labels">
              <label for="profile-pic">Upload Profile Picture:</label>
              <input type="file" id="profile-pic" name="profile-pic" />
            </div>
          </div>

          <div class="column">
            <div class="card">
              <div class="input-labels">
                <label for="country"
                  >Country <span class="req-symbol">*</span></label
                >
                <select id="country" name="country" required>
                  <option value="denmark">Denmark</option>
                  <option value="greece">Greece</option>
                  <option value="japan">Japan</option>
                  <option value="romania">Romania</option>
                  <option value="ukra">Ukraine</option>
                  <option value="other">Other</option>
                </select>
              </div>

              <div class="input-labels">
                <label for="city">City <span class="req-symbol">*</span></label>
                <input type="text" id="city" name="city" required />
              </div>

              <div class="input-labels">
                <label for="street">Street Address</label>
                <input
                  type="text"
                  id="street"
                  name="street"
                  placeholder="(Optional)"
                />
              </div>

              <div class="input-labels">
                <label for="apartment">Apartment Nr.</label>
                <input
                  type="text"
                  id="apartment"
                  name="apartment"
                  placeholder="(Optional)"
                />
              </div>

              <div class="input-labels">
                <label for="postal-code"
                  >Postal Code <span class="req-symbol">*</span></label
                >
                <input
                  type="text"
                  id="postal-code"
                  name="postal-code"
                  required
                />
              </div>
            </div>

            <div class="card">
              <div class="input-labels">
                <p>Favorite Movie Genre:</p>
                <div class="checkbox-grid">
                  <label
                    ><input type="checkbox" name="interests" value="action" />
                    Action</label
                  >
                  <label
                    ><input type="checkbox" name="interests" value="fantasy" />
                    Fantasy</label
                  >
                  <label
                    ><input type="checkbox" name="interests" value="horror" />
                    Thriller</label
                  >
                  <label
                    ><input type="checkbox" name="interests" value="romance" />
                    Anime</label
                  >
                  <label
                    ><input type="checkbox" name="interests" value="sci-fi" />
                    Sci-Fi</label
                  >
                  <label
                    ><input type="checkbox" name="interests" value="comedy" />
                    Comedy</label
                  >
                  <label
                    ><input type="checkbox" name="interests" value="drama" />
                    Drama</label
                  >
                  <label
                    ><input type="checkbox" name="interests" value="mystery" />
                    Mystery</label
                  >
                </div>
              </div>

              <div class="input-labels">
                <label for="fav-film">Favorite Film:</label>
                <textarea
                  id="fav-film"
                  name="fav-film"
                  rows="6"
                  placeholder="Write a few words about your favorite film. (Optional)"
                ></textarea>
              </div>

              <div class="input-labels">
                <label for="lucky-number">Lucky Number (1-12):</label>
                <input
                  type="number"
                  id="lucky-number"
                  name="lucky-number"
                  step="1"
                  min="1"
                  max="12"
                  placeholder="Pick you lucky number. (Optional)"
                />
              </div>

              <div class="input-labels">
                <label for="meme"></label>

                <input
                  type="range"
                  id="meme"
                  name="meme"
                  min="1"
                  max="100"
                  value="0"
                />
                <span>Light the Saber ! </span>
              </div>
            </div>
          </div>
        </section>

        <button type="submit">Create Account</button>
      </form>
    </main>
  </body>
</html>
